[project]
name = "insight-journal-template"
description = "A template for open science article submissions to the Insight Journal using MyST Markdown"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
# MyST ecosystem
mystmd = ">=1.6.0,<2"
jupyter-book = "*"

# Python scientific stack
python = ">=3.11"
numpy = "*"
matplotlib = "*"
scipy = "*"

# Development tools
jupyterlab = "*"

# Optional: for notebook execution
ipykernel = "*"

# Build manuscript PDF
typst = ">=0.13.1,<0.14"

[pypi-dependencies]
# ITK ecosystem
itk = "*"
simpleitk = "*"

[tasks]
build-html = "myst build --html"
# Does not require a LaTeX installation
build-pdf = "myst build --typst"
# Requires a LaTeX installation
build-arxiv = "myst build --pdf"
build-tex = "myst build --tex"
build-docx = "myst build --docx"
build-cff = "myst build --cff"
build-meca = "myst build --meca"

# Combined tasks
build = { depends-on = ["build-html", "build-pdf", "build-cff"] }
build-pdfs = { depends-on = ["build-pdf", "build-arxiv"] }
build-complete = { depends-on = ["build-html", "build-pdfs", "build-tex", "build-docx", "build-cff", "build-meca"] }

# Build source code
build-src = { cmd = "mkdir -p build && cd build && cmake ../src && make", cwd = "." }
test-src = { cmd = "cd build && ctest", cwd = ".", depends-on = ["build-src"] }

# Start development server
start = "myst start"
# Alias
dev = { depends-on = ["serve"] }

# Clean build artifacts
clean = "myst clean"

[feature.cmake.dependencies]
cmake = "*"
make = "*"
ninja = "*"

[feature.cmake.tasks]
configure-cmake = "cmake -B build -S src"
build-cmake = "cmake --build build"
test-cmake = "cd build && ctest"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["cmake"], solve-group = "default" }
